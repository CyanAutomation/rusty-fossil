[workspace]
members = [
    "crates/fossil-core",
    "crates/fossil-storage",
    "crates/fossil-soyuz",
    "crates/fossil-senku",
    "crates/fossil-queue",
    "crates/fossil-supervisor",
    "crates/fossil-workspace",
    "crates/fossil-gateway",
    "crates/fossil-synthetic-worker",
    "crates/rusty-fossil",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/CyanAutomation/rusty-fossil"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
fossil-core = { path = "crates/fossil-core" }
fossil-soyuz = { path = "crates/fossil-soyuz" }
fossil-senku = { path = "crates/fossil-senku" }
fossil-queue = { path = "crates/fossil-queue" }
fossil-storage = { path = "crates/fossil-storage" }
fossil-supervisor = { path = "crates/fossil-supervisor" }
bollard = { version = "=0.21.1", default-features = false, features = ["http", "pipe"] }
futures-util = "0.3"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server", "service", "tokio"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.43", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
