name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Check minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep this aligned with workspace.package.rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on Rust 1.89
        run: cargo check --workspace --locked

  quality:
    name: Format, lint, test, and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify pinned Senku profile artifact
        run: sha256sum --check .senku-contract.sha256
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --workspace --release --locked

  dependency-audit:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  synthetic-worker-multiplatform:
    name: Build synthetic worker (AMD64 and ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both supported worker architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.synthetic-worker
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/synthetic-worker.oci

  pi-worker-tests:
    name: Test the Pi worker wrapper and dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Install the locked Pi runtime dependencies
        working-directory: worker/pi
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the worker wrapper
        run: node --test worker/pi/worker.test.mjs

  compose-config-tests:
    name: Validate Docker Compose service boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Check Compose configuration and socket isolation
        run: node --test deploy/compose.test.mjs

  api-docs:
    name: Type-check the API docs renderer and verify its bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Install the TypeScript compiler
        working-directory: docs-ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check the documentation renderer
        working-directory: docs-ui
        run: npm run check
      - name: Build the checked-in documentation asset
        working-directory: docs-ui
        run: npm run build
      - name: Verify the generated asset is up to date
        run: git diff --exit-code -- crates/rusty-fossil/static/docs.js

  pi-worker-multiplatform:
    name: Build Pi worker (AMD64 and ARM64) with SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both supported worker architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/pi/Dockerfile.pi-worker
          platforms: linux/amd64,linux/arm64
          push: false
          sbom: true
          provenance: mode=max
          outputs: type=oci,dest=/tmp/pi-worker.oci

  docker-integration:
    name: Run the Soyuz-gated worker on Docker Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the synthetic worker for the runner
        run: docker build --platform linux/amd64 -f Dockerfile.synthetic-worker -t rusty-fossil-synthetic-worker:test .
      - name: Capture the immutable local image ID
        run: echo "FOSSIL_SUPERVISOR_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' rusty-fossil-synthetic-worker:test)" >> "$GITHUB_ENV"
      - name: Build the test-support supervisor executable
        run: cargo build -p fossil-supervisor --features test-support --bin fossil-supervisord --locked
      - name: Run the authorized Docker lifecycle integration
        run: cargo test -p fossil-supervisor --features test-support --test docker_engine --locked -- --ignored
      - name: Run coordinator-to-supervisor process integration
        run: FOSSIL_SUPERVISORD_BIN="$GITHUB_WORKSPACE/target/debug/fossil-supervisord" cargo test -p rusty-fossil --test synthetic_execution_engine --locked -- --ignored

  linux-targets:
    name: Cross build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build controller target
        run: cross build --target ${{ matrix.target }} --release --locked -p rusty-fossil --bin rusty-fossil
      - name: Build Docker supervisor target
        run: cross build --target ${{ matrix.target }} --release --locked -p fossil-supervisor --bin fossil-supervisord
