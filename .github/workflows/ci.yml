name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Check minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep this aligned with workspace.package.rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on Rust 1.89
        run: cargo check --workspace --locked

  quality:
    name: Format, lint, test, and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --workspace --release --locked

  dependency-audit:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  synthetic-worker-multiplatform:
    name: Build synthetic worker (AMD64 and ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both supported worker architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.synthetic-worker
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/synthetic-worker.oci

  docker-integration:
    name: Run the Soyuz-gated worker on Docker Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the synthetic worker for the runner
        run: docker build --platform linux/amd64 -f Dockerfile.synthetic-worker -t rusty-fossil-synthetic-worker:test .
      - name: Capture the immutable local image ID
        run: echo "FOSSIL_SUPERVISOR_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' rusty-fossil-synthetic-worker:test)" >> "$GITHUB_ENV"
      - name: Run the authorized Docker lifecycle integration
        run: cargo test -p fossil-supervisor --test docker_engine --locked -- --ignored

  linux-targets:
    name: Cross build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build controller target
        run: cross build --target ${{ matrix.target }} --release --locked -p rusty-fossil
